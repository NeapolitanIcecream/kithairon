name: Documentation issue
description: Report unclear, missing, stale, or incorrect documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: input
    id: page
    attributes:
      label: Page or section
      placeholder: README quickstart, docs/visualization.md, docs/scoring-and-rules.md
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
      description: Include wording, examples, or commands that would have helped.
