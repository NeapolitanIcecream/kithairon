[project]
name = "kithairon"
version = "0.1.0"
description = "Generate playable and explainable canon variants from a monophonic melody."
authors = [
    { name = "chenmohan", email = "gnuicecream@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "music21>=10.1.0",
    "pydantic>=2",
    "rich>=15.0.0",
    "typer>=0.25.1",
]

[project.scripts]
canonize = "kithairon.cli:main"

[project.optional-dependencies]
solver = [
    "ortools>=9.15.6755",
]
docs = [
    "mkdocs-material>=9.7.6",
]

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.14.0",
    "cremona",
    "hypothesis>=6.152.7",
    "pre-commit>=4.6.0",
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = []

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["src", "tests"]

[tool.cremona]
profile = "kithairon"
targets = ["src", "tests"]
exclude = [
    ".git",
    ".venv",
    ".pytest_cache",
    ".ruff_cache",
    ".pyright",
    "site",
    "output",
    "*/__pycache__/*",
]
out_dir = "output/refactor-audit"
baseline = "quality/refactor-baseline.json"

[tool.cremona.profiles.kithairon]
base = "generic-python"
subsystem_priority_offsets = { tests = -10 }

[tool.uv.sources]
cremona = { git = "https://github.com/NeapolitanIcecream/cremona.git" }
